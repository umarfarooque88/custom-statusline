  :root{
    --jungle:#0f4a33; --mango:#f6a01a; --pink:#ef3f86; --sky:#3bb7c9; --lime:#9ccc3c;
    --paper:#f7eedb; --paper-hi:#fffaf0; --ink:#1d1712; --ink2:#54483b; --ink3:#6f6253;
    --tape:rgba(255,246,214,.62);
    --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
    --paste:0 1px 1px rgba(0,0,0,.18), 0 8px 18px rgba(0,0,0,.22);
    --lift:0 2px 3px rgba(0,0,0,.18), 0 16px 28px rgba(0,0,0,.3);
    --ease:cubic-bezier(.22,1,.36,1); --pop:cubic-bezier(.34,1.4,.64,1);
  }
  *{ box-sizing:border-box; }
  html{ background:var(--jungle); color:var(--ink); scrollbar-color:var(--mango) var(--jungle); }
  body{ margin:0; font-family:"Hanken",system-ui,sans-serif; min-height:100vh; padding:40px 32px 64px; }
  ::selection{ background:var(--pink); color:var(--paper-hi); }
  :focus-visible{ outline:3px solid var(--mango); outline-offset:3px; }

  .album{ max-width:1280px; margin:0 auto; }
  .top{ display:flex; align-items:end; justify-content:space-between; gap:16px 24px; margin-bottom:8px; color:var(--paper); flex-wrap:wrap; }
  .top h1{ margin:0; font-family:"Brico"; font-weight:700; font-stretch:80%; font-size:40px; line-height:1.1; letter-spacing:-.02em; }
  .top h1 span{ color:var(--mango); }

// derive each design's identity hue from its CALM preview (the model tag / brand
// colors), not the hot state — otherwise every accent becomes the alarm red.
// Prefer the earliest reasonably-saturated color, which is the identity segment.
function accentOf(n){
  const html=(PREVIEWS[n]&&PREVIEWS[n].calm)||'';
  const cols=[...html.matchAll(/rgb\((\d+),(\d+),(\d+)\)/g)].map(m=>[+m[1],+m[2],+m[3]]);
  for(const [r,g,b] of cols){                       // first identity-strength color wins
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    const sat=mx===0?0:(mx-mn)/mx, lum=mx/255;       // no upper lum cap: bright pastels
    if(sat>=.33 && lum>=.42) return `rgb(${r},${g},${b})`;  // (lavender, purple) are wanted
  }
  let best=null, bestS=-1;                           // fallback: most saturated legible
  for(const [r,g,b] of cols){
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    const sat=mx===0?0:(mx-mn)/mx, lum=mx/255;
    if(lum<.4) continue;
    if(sat>bestS){ bestS=sat; best=[r,g,b]; }
  }
  return best?`rgb(${best[0]},${best[1]},${best[2]})`:'#e2896a';
}
const GROUPS=['All','Everyday','Expressive','Style studies','Game art styles'];
const GROUP_COLOR={Everyday:'var(--mango)',Expressive:'var(--pink)','Style studies':'var(--sky)','Game art styles':'var(--lime)'};
const state={ group:'All', safeOnly:false, sel:0, buf:'', bufTimer:null, built:'' };
const $=s=>document.querySelector(s);
const NOTE=n=>`then paste it in Claude Code. Change later with <code>/custom-statusline → ${n}</code>`;
// text on a design's colour block: dark ink on light hues, paper on dark ones
const onColor=c=>{ const [r,g,b]=c.match(/\d+/g).map(Number); return (0.299*r+0.587*g+0.114*b)>150?'#1d1712':'#fffaf0'; };

function matches(i){ const d=CARDS[i];
  return (state.group==='All'||d.group===state.group) && (!state.safeOnly||d.badge[1]==='safe'); }
function visibleIdx(){ return CARDS.map((_,i)=>i).filter(matches); }

function buildFilters(){
  $('#filters').innerHTML=GROUPS.map(g=>`<button class="chipf" data-g="${g}">${g}</button>`).join('')+
    `<label class="safe"><input type="checkbox" id="safeonly"> Font-safe only (${CARDS.filter(d=>d.badge[1]==='safe').length})</label>`;
  $('#filters').querySelectorAll('.chipf').forEach(b=>b.onclick=()=>{ state.group=b.dataset.g; ensureVisible(); });
  $('#safeonly').onchange=e=>{ state.safeOnly=e.target.checked; ensureVisible(); };
}
function renderTabs(){
  const key=state.group+state.safeOnly;
  if(key!==state.built){ state.built=key;   // rebuild only on filter change so the selected tab can animate
    const vis=visibleIdx();
    $('#tabs').innerHTML=vis.map(i=>`<button class="tab" role="option" data-i="${i}" style="--c:${GROUP_COLOR[CARDS[i].group]}" aria-label="${i+1}, ${CARDS[i].name}" title="${CARDS[i].name}">${i+1}</button>`).join('')
      || '<span class="none">No designs match</span>';
    $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>select(+b.dataset.i));
  }
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',+b.dataset.i===state.sel));
  $('#filters').querySelectorAll('.chipf').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===state.group));
}
function ensureVisible(){ const vis=visibleIdx(); if(vis.length&&!vis.includes(state.sel)) state.sel=vis[0]; select(state.sel); }

function select(i){
  state.sel=i; const d=CARDS[i], pv=PREVIEWS[i+1]||{calm:'',hot:''}, c=accentOf(i+1);
  const block=$('#block'); block.style.setProperty('--c',c); block.style.setProperty('--on',onColor(c));
  $('#no').textContent=String(i+1).padStart(2,'0');
  $('#name').textContent=d.name;
  $('#meta').innerHTML=`<b>${d.group}</b> · ${d.badge[1]==='font'?'needs a '+d.badge[0]+' font':'works in any font'}`;
  $('#pitch').innerHTML=d.pitch;
  $('#calm').innerHTML=pv.calm; $('#hot').innerHTML=pv.hot;
  $('#copy').textContent='Copy number '+(i+1);
  $('#note').innerHTML=NOTE(i+1);
  if(block.animate && !matchMedia('(prefers-reduced-motion:reduce)').matches)
    block.animate([{transform:'rotate(-2deg) translateY(-8px) scale(1.02)'},{transform:'rotate(-2deg)'}],{duration:380,easing:'cubic-bezier(.34,1.4,.64,1)'});
  renderTabs();
}

let toastTimer=null;
function toast(html){ const t=$('#toast'); t.innerHTML=html; t.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),1900); }
function copyNumber(n){
  const show=()=>toast(`Copied <b>${n}</b>. Paste it in Claude Code`);
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(String(n)).then(show,show); else show();
}
$('#copy').onclick=()=>copyNumber(state.sel+1);

function move(delta){
  const vis=visibleIdx(); if(!vis.length) return;
  let p=vis.indexOf(state.sel); if(p<0) p=0;
  select(vis[Math.max(0,Math.min(vis.length-1,p+delta))]);
}
window.addEventListener('keydown',e=>{
  if(e.target.matches('input')||e.altKey||e.ctrlKey||e.metaKey) return;
  if(['ArrowRight','ArrowDown','j'].includes(e.key)){ e.preventDefault(); move(1); }
  else if(['ArrowLeft','ArrowUp','k'].includes(e.key)){ e.preventDefault(); move(-1); }
  else if(e.key==='Enter' && !e.target.matches('button,a')){ e.preventDefault(); copyNumber(state.sel+1); }
  else if(/^[0-9]$/.test(e.key)){
    state.buf=(state.buf+e.key).slice(-2);
    let n=parseInt(state.buf,10);
    if(n>27){ state.buf=e.key; n=parseInt(state.buf,10); }
    toast(`Go to <b>${state.buf}</b>`);
    clearTimeout(state.bufTimer); state.bufTimer=setTimeout(()=>{ state.buf=''; },900);
    if(n>=1&&n<=27){ if(!matches(n-1)){ state.group='All'; state.safeOnly=false; $('#safeonly').checked=false; } select(n-1); }
  }
});

buildFilters();
const pick=parseInt(new URLSearchParams(location.search).get('pick'),10);   // deep-link: ?pick=14
select(pick>=1&&pick<=27 ? pick-1 : 0);
</script>
